name: Hermes Autonomous Healer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write

jobs:
  hermes-shadow-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 5  # Enables CIDetectiveAgent to extract commit intent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Run Tests
        id: tests
        run: |
          pip install -r requirements.txt || true
          pytest tests/ -q

      - name: Run Hermes Autonomous Healer (Triggered on Test Failure)
        if: failure()
        id: hermes
        uses: ./  # Self-host dogfooding from repository root
        with:
          mode: 'shadow'  # Zero-Write: posts in-diff ```suggestion blocks in PR reviews
          test-command: 'pytest tests/ -q'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: 'none'  # Uses deterministic zero-API-key engine
          hourly-rate-usd: '125.0'

      - name: Upload SARIF Audit Report to GitHub Code Scanning
        if: always() && steps.hermes.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.hermes.outputs.sarif-file }}
