name: CI Suite

on:
  push:
    branches: [ main, feat/tester-console, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[dev]" || true

      - name: Run Syntax Guard
        run: |
          python scripts/syntax_guard.py

      - name: Run Full Pytest Suite (Heuristic & Local Wire)
        run: |
          python -m pytest tests/ -q

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Hermes Tester Console Playwright E2E
        run: |
          python -m pytest console_tests/ -v

      - name: Upload Console E2E Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-e2e-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore

  provenance:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Package Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

