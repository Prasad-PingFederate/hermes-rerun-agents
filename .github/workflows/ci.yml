name: CI Suite

on:
  push:
    branches: [ main, feat/tester-console, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python 3.10 Syntax Guard
        run: |
          python scripts/syntax_guard.py

      - name: Run Full Pytest Suite (Heuristic & Local Wire)
        run: |
          python -m pytest tests/ -q

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Hermes Tester Console Playwright E2E
        run: |
          python -m pytest console_tests/ -v

      - name: Upload Console E2E Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-e2e-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore

