name: 'Hermes Autonomous Test Healer & Shadow Mode Agent'
description: 'Autonomous, governed AI engineering loop: detects CI test failures, diagnoses root cause, validates with Delta-SAST & Zero Assertion Erosion, and posts 1-click in-diff review suggestions or draft PRs.'
author: 'Hermes Platform Engineering'
branding:
  icon: 'shield'
  color: 'orange'

# Recommended Workflow Permissions:
# permissions:
#   contents: read               # Zero-write in default 'shadow' mode
#   pull-requests: write         # Required for 'shadow' mode (posting in-diff review suggestions)
#   contents: write              # Optional: Required only for 'heal' mode (opening branches and draft PRs)
#   id-token: write              # Optional: Required for Option 5 Cloud OIDC Workload Identity
#   security-events: write       # Optional: Required for uploading SARIF to GitHub Code Scanning
#   actions: read                # Required for fetching workflow logs and commit metadata

inputs:
  mode:
    description: "Execution permissions mode: 'shadow' (Zero-Write in-diff suggestion comments) or 'heal' (opens draft PR)"
    required: false
    default: 'shadow'
  test-command:
    description: 'Command used to run test suite (e.g., "pytest", "npm test", "npx playwright test")'
    required: false
    default: 'python -m pytest'
  artifact-path:
    description: 'Glob pattern or file path to post-run test artifacts (e.g., "**/junit*.xml", "**/ctrf*.json", "**/trace.zip"). When provided, test-command execution is skipped.'
    required: false
    default: ''
  github-token:
    description: 'GitHub Token for posting review suggestions or opening draft PRs'
    required: false
    default: ${{ github.token }}
  llm-provider:
    description: 'LLM Provider: "ollama", "claude_code", "openai", "groq", "anthropic", "gemini", or "none" (offline heuristic)'
    required: false
    default: 'none'
  hourly-rate-usd:
    description: 'Fully loaded engineering hourly rate for Executive ROI calculation (default: 125.0)'
    required: false
    default: '125.0'
  anthropic-api-key:
    description: 'Anthropic API Key (optional)'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API Key (optional)'
    required: false
    default: ''
  gemini-api-key:
    description: 'Google Gemini API Key (optional)'
    required: false
    default: ''
  groq-api-key:
    description: 'Groq API Key (optional)'
    required: false
    default: ''
  require-oidc:
    description: "Enforce strict cloud OIDC federation (AWS Bedrock, Azure OpenAI, Google Vertex AI). When true, static API keys are rejected. Requires workflow permission: id-token: write"
    required: false
    default: 'false'

outputs:
  status:
    description: 'Outcome status (passed, suggested, healed, quarantined, blocked_by_governance)'
    value: ${{ steps.run-hermes.outputs.status }}
  verdict:
    description: 'Deterministic root-cause failure classification (PRODUCT_BUG, TEST_BUG, FLAKY_TEST, ENVIRONMENT_NOISE, PASSED)'
    value: ${{ steps.run-hermes.outputs.verdict }}
  healed:
    description: 'Boolean flag indicating whether a failure was successfully healed or quarantined'
    value: ${{ steps.run-hermes.outputs.healed }}
  hours_saved:
    description: 'Engineering hours saved by autonomous diagnosis and healing'
    value: ${{ steps.run-hermes.outputs.hours_saved }}
  dollar_roi:
    description: 'Estimated dollar ROI value saved in engineering time'
    value: ${{ steps.run-hermes.outputs.dollar_roi }}
  branch:
    description: 'Git branch created in heal mode (if applicable)'
    value: ${{ steps.run-hermes.outputs.branch }}
  sarif-report:
    description: 'File path to generated GitHub Code Scanning SARIF v2.1.0 report'
    value: ${{ steps.run-hermes.outputs.sarif_report }}
  sarif-file:
    description: 'Direct file path alias for piping into github/codeql-action/upload-sarif@v3'
    value: ${{ steps.run-hermes.outputs.sarif_file }}
  audit-digest:
    description: 'Tamper-evident SHA-256 audit digest over commit, policy, and findings'
    value: ${{ steps.run-hermes.outputs.audit_digest }}
  clusters-collapsed:
    description: 'Count of parallel runner shard failures collapsed into this root-cause fix'
    value: ${{ steps.run-hermes.outputs.clusters_collapsed }}
  tricorder-action:
    description: 'Google Tricorder confidence gating action (PUBLISH_INLINE, PUBLISH_COLLAPSED, SUPPRESS_SILENT)'
    value: ${{ steps.run-hermes.outputs.tricorder_action }}
  recommended-action:
    description: 'Bayesian & cost-aware remediation action (FAIL_FAST_ESCALATE, PROPOSE_VERIFIED_PATCH, AUTO_RERUN_TRANSIENT, etc.)'
    value: ${{ steps.run-hermes.outputs.recommended_action }}
  calibrated-confidence:
    description: 'Calibrated confidence score calculated by Bayesian Beta-Binomial posterior smoothing'
    value: ${{ steps.run-hermes.outputs.calibrated_confidence }}
  allow-rerun:
    description: 'Whether CI should authorize automated retries based on zero-waste policy'
    value: ${{ steps.run-hermes.outputs.allow_rerun }}
  max-retries:
    description: 'Maximum retry count authorized for this failure classification'
    value: ${{ steps.run-hermes.outputs.max_retries }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Isolated Hermes Environment
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/hermes_env
        key: hermes-venv-${{ runner.os }}-${{ hashFiles(format('{0}/requirements.txt', github.action_path), format('{0}/pyproject.toml', github.action_path)) }}

    - name: Bootstrap Isolated Hermes Environment
      shell: bash
      run: |
        if [ ! -d "${{ runner.temp }}/hermes_env" ]; then
          python -m venv "${{ runner.temp }}/hermes_env"
        fi
        if [ -f "${{ runner.temp }}/hermes_env/Scripts/python.exe" ]; then
          HERMES_PY="${{ runner.temp }}/hermes_env/Scripts/python.exe"
        else
          HERMES_PY="${{ runner.temp }}/hermes_env/bin/python"
        fi
        echo "HERMES_PYTHON=$HERMES_PY" >> $GITHUB_ENV
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" != 'true' ]; then
          if [ -f "${{ github.action_path }}/requirements.txt" ]; then
            "$HERMES_PY" -m pip install --upgrade pip -q || true
            "$HERMES_PY" -m pip install -q -r "${{ github.action_path }}/requirements.txt" || true
          fi
          "$HERMES_PY" -m pip install -q -e "${{ github.action_path }}" || true
        fi

    - name: Fetch Target Base Git Ref for Differential Verification
      shell: bash
      run: |
        if [ -n "${{ github.base_ref }}" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1 || true
        fi

    - name: Run Hermes Autonomous Healer
      id: run-hermes
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TEST_COMMAND: ${{ inputs.test-command }}
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_HOURLY_RATE_USD: ${{ inputs.hourly-rate-usd }}
        HERMES_LLM_PROVIDER: ${{ inputs.llm-provider }}
        HERMES_IS_FORK_PR: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository) }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
      run: |
        "$HERMES_PYTHON" ${{ github.action_path }}/scripts/hermes_action_runner.py
